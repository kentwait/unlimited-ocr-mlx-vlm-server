[project]
name = "unlimited-ocr-server"
version = "0.4.0"
description = "FastAPI sidecar: digital-born PDF -> structured spans (pymupdf4llm text/structure + PP-DocLayout-S figures)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "anyio>=4.4.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "pymupdf>=1.28.0",
    "pymupdf4llm>=1.28.0",
    "onnxruntime>=1.18.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pytest-cov>=7.1.0",
    "hypothesis>=6.168.0",
    "mutmut>=3.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocr_server"]

[project.scripts]
ocr-server = "ocr_server.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/ocr_server"]
branch = false

[tool.coverage.report]
show_missing = true
skip_covered = false
# fail_under is enforced by CI/Makefile, not here, so local runs stay fast:
# make coverage  (fail_under=95; ratchet up, never down)

[tool.mutmut]
# Manual mutation runs only (`make mutate`), never CI.
source_paths = ["src/ocr_server"]
# Log-call lines are not behavior: no test asserts log text, and message
# mutants only add noise to triage.
do_not_mutate_patterns = ["^\\s*log\\.(debug|info|warning|error|exception)\\("]

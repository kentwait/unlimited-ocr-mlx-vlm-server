[project]
name = "unlimited-ocr-server"
version = "0.1.0"
description = "LAN FastAPI server wrapping LoJexLLM/Unlimited-OCR-MLX: PDF & image -> markdown via MLX on Apple Silicon"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "anyio>=4.4.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "pymupdf>=1.24.0",
    "mlx>=0.20.0",
    "safetensors>=0.4.0",
    "transformers>=4.45.0",
    "mlx-vlm>=0.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "huggingface-hub[hf_xet]>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocr_server"]

[project.scripts]
ocr-server = "ocr_server.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
